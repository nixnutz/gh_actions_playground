name: Call composite
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run a one-line script
        run: echo Hello, world!
        
      - name: Use my composite action
        id: my-action
        uses: ./.github/actions/my-composite
        with:
          node-version: '18'

      - name: Display result
        run: |
          echo "Script Result: ${{ steps.my-action.outputs.script-result }}"
